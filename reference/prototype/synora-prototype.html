<style>
:root { --canvas: #f4f5f7; --surface: #ffffff; --surface-sunken: #eef0f3; --surface-hover: #f1f4f8; --surface-selected: #e7eef8; --sidebar: #ffffff; --border: #e0e4ea; --border-control: #8a94a3; --ink: #161b22; --ink-muted: #566170; --ink-disabled: #9aa3ae; --primary: #1d4f91; --primary-hover: #163d72; --on-primary: #ffffff; --primary-soft: #e8eff9; --primary-ink: #1a4682; --accent: #c2410c; --accent-soft: #fdeee4; --accent-ink: #9a330a; --company-soft: #e1f2ef; --company-ink: #0d5c54; --success: #1d7a45; --success-soft: #e5f4eb; --success-ink: #15613a; --warning: #a35d00; --warning-soft: #fdf2df; --warning-ink: #7d4700; --danger: #b42318; --danger-soft: #fdeceb; --danger-ink: #931c13; --on-danger: #ffffff; --neutral-soft: #eceef2; --neutral-ink: #4a5361; --cal-annual: #2f63a8; --cal-unpaid: #5b6575; --cal-absent: #a3486b; --on-cal: #ffffff; --overlay: rgba(14,18,24,0.48); --shadow-sm: 0 1px 2px rgba(16,24,40,0.06); --shadow-md: 0 6px 16px rgba(16,24,40,0.10); --shadow-lg: 0 20px 48px rgba(16,24,40,0.20); --space-1: 4px; --space-2: 8px; --space-3: 12px; --space-4: 16px; --space-5: 20px; --space-6: 24px; --space-8: 32px; --radius-sm: 4px; --radius-md: 6px; --radius-lg: 10px; --radius-pill: 999px; --sidebar-width: 240px; --topbar-height: 56px; --control-height: 36px; --row-height: 52px; --drawer-width: 520px; --font-sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif; --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --canvas: #101317; --surface: #181c22; --surface-sunken: #0c0f12; --surface-hover: #20262e; --surface-selected: #1c2a3d; --sidebar: #14181d; --border: #2a313a; --border-control: #6b7684; --ink: #e9ecf0; --ink-muted: #a2acb8; --ink-disabled: #5d6773; --primary: #86b0ea; --primary-hover: #a3c3f0; --on-primary: #0b1a2e; --primary-soft: #1a2a40; --primary-ink: #a9c6f0; --accent: #f2925a; --accent-soft: #3a2416; --accent-ink: #f6ad80; --company-soft: #11302c; --company-ink: #74d3c7; --success: #5cc68a; --success-soft: #12301f; --success-ink: #86dba9; --warning: #f0b44c; --warning-soft: #352710; --warning-ink: #f6c97a; --danger: #f47c70; --danger-soft: #3b1714; --danger-ink: #f9a39a; --on-danger: #2a0b08; --neutral-soft: #262c34; --neutral-ink: #b4bcc7; --cal-annual: #6f9fe0; --cal-unpaid: #8f99a8; --cal-absent: #e08aab; --on-cal: #0d1117; --overlay: rgba(0,0,0,0.6); --shadow-sm: 0 1px 2px rgba(0,0,0,0.4); --shadow-md: 0 6px 16px rgba(0,0,0,0.5); --shadow-lg: 0 20px 48px rgba(0,0,0,0.6); color-scheme: dark; } }
:root[data-theme="dark"] { --canvas: #101317; --surface: #181c22; --surface-sunken: #0c0f12; --surface-hover: #20262e; --surface-selected: #1c2a3d; --sidebar: #14181d; --border: #2a313a; --border-control: #6b7684; --ink: #e9ecf0; --ink-muted: #a2acb8; --ink-disabled: #5d6773; --primary: #86b0ea; --primary-hover: #a3c3f0; --on-primary: #0b1a2e; --primary-soft: #1a2a40; --primary-ink: #a9c6f0; --accent: #f2925a; --accent-soft: #3a2416; --accent-ink: #f6ad80; --company-soft: #11302c; --company-ink: #74d3c7; --success: #5cc68a; --success-soft: #12301f; --success-ink: #86dba9; --warning: #f0b44c; --warning-soft: #352710; --warning-ink: #f6c97a; --danger: #f47c70; --danger-soft: #3b1714; --danger-ink: #f9a39a; --on-danger: #2a0b08; --neutral-soft: #262c34; --neutral-ink: #b4bcc7; --cal-annual: #6f9fe0; --cal-unpaid: #8f99a8; --cal-absent: #e08aab; --on-cal: #0d1117; --overlay: rgba(0,0,0,0.6); --shadow-sm: 0 1px 2px rgba(0,0,0,0.4); --shadow-md: 0 6px 16px rgba(0,0,0,0.5); --shadow-lg: 0 20px 48px rgba(0,0,0,0.6); color-scheme: dark; }
.page-title { font-family: var(--font-sans); font-size: 24px; line-height: 32px; font-weight: 600; }
.figure { font-family: var(--font-sans); font-size: 32px; line-height: 36px; font-weight: 600; }
.section-title { font-family: var(--font-sans); font-size: 16px; line-height: 24px; font-weight: 600; }
.body { font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 400; }
.body-strong { font-family: var(--font-sans); font-size: 14px; line-height: 20px; font-weight: 600; }
.small { font-family: var(--font-sans); font-size: 13px; line-height: 18px; font-weight: 400; }
.caption { font-family: var(--font-sans); font-size: 12px; line-height: 16px; font-weight: 500; }
.overline { font-family: var(--font-sans); font-size: 11px; line-height: 16px; font-weight: 600; }
.code { font-family: var(--font-mono); font-size: 12px; line-height: 16px; font-weight: 500; }

/* Synora component styles. All values come from tokens.css custom properties. */
.vf-app, .vf-app *, .vf-preview, .vf-preview * { box-sizing: border-box; }
body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 20px; -webkit-font-smoothing: antialiased; }
.vf-preview { padding: var(--space-6); display: flex; flex-wrap: wrap; gap: var(--space-4); align-items: flex-start; font-family: var(--font-sans); color: var(--ink); }
.vf-preview--col { flex-direction: column; align-items: stretch; }
.vf-preview h4 { margin: 0 0 var(--space-2); font: 600 11px/16px var(--font-sans); letter-spacing: .06em; text-transform: uppercase; color: var(--ink-muted); width: 100%; }
.vf-preview .vf-group { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
.figure { font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -0.02em; }
.code { font-family: var(--font-mono); font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted); }
.small { font-size: 13px; line-height: 18px; }
.vf-muted { color: var(--ink-muted); }
.vf-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.vf-icon { flex: none; display: inline-block; vertical-align: middle; }
.vf-mt { margin-top: var(--space-5) !important; }
.is-neg { color: var(--danger); }
.rot90 svg { transform: rotate(90deg); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ---------- App shell ---------- */
.vf-app { display: flex; height: 100vh; min-height: 560px; background: var(--canvas); color: var(--ink); font-family: var(--font-sans); font-size: 14px; line-height: 20px; position: relative; overflow: hidden; overflow: clip; }
.vf-sidebar { width: var(--sidebar-width); flex: none; background: var(--sidebar); border-inline-end: 1px solid var(--border); display: flex; flex-direction: column; padding: var(--space-4) var(--space-3); gap: var(--space-2); overflow-y: auto; }
.vf-brand { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-1) var(--space-2) var(--space-3); }
.vf-brand__mark { width: 30px; height: 30px; border-radius: var(--radius-md); background: var(--primary); display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 7px 6px; align-items: end; flex: none; }
.vf-brand__mark i { display: block; background: var(--on-primary); border-radius: 1px; height: 100%; }
.vf-brand__mark i:nth-child(1) { height: 45%; } .vf-brand__mark i:nth-child(2) { height: 100%; opacity: .55; } .vf-brand__mark i:nth-child(3) { height: 70%; }
.vf-brand__mark--sm { width: 26px; height: 26px; padding: 6px 5px; }
.vf-brand__name { display: block; font-weight: 600; font-size: 16px; line-height: 20px; letter-spacing: -0.01em; }
.vf-brand__org { display: block; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.vf-sidebar__cta { width: 100%; justify-content: center; margin-bottom: var(--space-2); }
.vf-nav__group { display: flex; flex-direction: column; gap: 2px; margin-top: var(--space-2); }
.vf-nav__label { margin: var(--space-2) var(--space-3) var(--space-1); color: var(--ink-muted); font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.vf-nav__item { display: flex; align-items: center; gap: var(--space-3); height: 36px; padding: 0 var(--space-3); border: 0; background: none; border-radius: var(--radius-md); color: var(--ink-muted); cursor: pointer; text-align: start; font-weight: 500; position: relative; }
.vf-nav__item span:nth-child(2) { flex: 1; }
.vf-nav__item:hover { background: var(--surface-hover); color: var(--ink); }
.vf-nav__item.is-on { background: var(--surface-selected); color: var(--primary-ink); font-weight: 600; }
.vf-nav__item.is-on::before { content: ''; position: absolute; inset-inline-start: -12px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--primary); }
.vf-sidebar__foot { margin-top: auto; padding: var(--space-3) var(--space-2) 0; }
.vf-sidebar__help { display: flex; gap: var(--space-2); font-size: 12px; line-height: 16px; color: var(--ink-muted); margin: 0; }
.vf-shell { flex: 1; min-width: 0; display: flex; position: relative; overflow: hidden; overflow: clip; }
.vf-main { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.vf-topbar { height: var(--topbar-height); flex: none; display: flex; align-items: center; gap: var(--space-4); padding: 0 var(--space-6); background: var(--surface); border-bottom: 1px solid var(--border); }
.vf-topbar__title { display: flex; align-items: baseline; gap: var(--space-3); min-width: 0; flex: 1; }
.vf-topbar__h { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; white-space: nowrap; }
.vf-topbar__date { color: var(--ink-muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.vf-topbar__right { display: flex; align-items: center; gap: var(--space-3); }
.vf-topbar__user { display: flex; align-items: center; gap: var(--space-2); padding-inline-start: var(--space-3); border-inline-start: 1px solid var(--border); }
.vf-topbar__who { display: flex; flex-direction: column; }
.vf-topbar__name { font-weight: 600; font-size: 13px; line-height: 18px; }
.vf-topbar__role { font-size: 12px; line-height: 16px; color: var(--ink-muted); white-space: nowrap; }
.vf-roleswitch { position: relative; display: inline-flex; align-items: center; height: 32px; border: 1px dashed var(--border-control); border-radius: var(--radius-md); padding: 0 var(--space-2) 0 4px; gap: var(--space-2); background: var(--surface); }
.vf-roleswitch__tag { font-size: 10px; line-height: 14px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; background: var(--neutral-soft); color: var(--neutral-ink); padding: 2px 6px; border-radius: var(--radius-sm); }
.vf-roleswitch select { appearance: none; border: 0; background: none; padding-inline-end: 18px; font-size: 13px; font-weight: 500; cursor: pointer; }
.vf-roleswitch .vf-icon { position: absolute; inset-inline-end: 8px; pointer-events: none; color: var(--ink-muted); }
.vf-content { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; }
.vf-page { padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); max-width: 1320px; }
.vf-pagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
.vf-pagehead .page-title, .page-title { margin: 0; font-size: 24px; line-height: 32px; font-weight: 600; letter-spacing: -0.01em; }
.vf-pagehead__sub { margin: 4px 0 0; color: var(--ink-muted); font-size: 13px; line-height: 18px; max-width: 760px; }
.vf-pagehead__person { display: flex; align-items: center; gap: var(--space-3); }
.vf-back { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; padding: 0; margin-bottom: var(--space-2); color: var(--primary); cursor: pointer; font-size: 13px; font-weight: 500; }
.vf-back:hover { text-decoration: underline; }
.section-title { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
.body-strong { font-weight: 600; }

/* grids */
.vf-grid { display: grid; gap: var(--space-4); }
.vf-grid--2 { grid-template-columns: 1fr 1fr; }
.vf-grid--4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.vf-grid--dash { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); align-items: start; }
.vf-grid--dash2 { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; }
.vf-grid--form { grid-template-columns: minmax(0, 1.25fr) minmax(320px, 1fr); align-items: start; }
.vf-grid--side { grid-template-columns: 260px minmax(0, 1fr) 300px; align-items: start; }
.vf-col { display: flex; flex-direction: column; gap: var(--space-4); min-width: 0; }
.vf-col--sticky { position: static; }
.vf-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: var(--space-3); }
.vf-row-inline { display: inline-flex; gap: var(--space-2); align-items: center; flex-wrap: wrap; }
.vf-stack { display: flex; flex-direction: column; gap: var(--space-3); }
.vf-stack p { margin: 0; }
.vf-stack-xs { display: flex; flex-direction: column; gap: 2px; }

/* ---------- Card ---------- */
.vf-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); min-width: 0; }
.vf-card__head { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); padding: var(--space-4) var(--space-5) 0; }
.vf-card__head + div:not(.vf-card__body) { margin-top: var(--space-3); }
.vf-card__title { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
.vf-card__sub { margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.vf-card__body { padding: var(--space-4) var(--space-5) var(--space-5); }
.vf-eyebrow { margin: 0; display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted); }

/* ---------- Buttons ---------- */
.vf-btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); height: var(--control-height); padding: 0 14px; border-radius: var(--radius-md); border: 1px solid transparent; font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap; transition: background-color .12s, border-color .12s; }
.vf-btn:disabled { cursor: not-allowed; opacity: .5; }
.vf-btn--sm { height: 32px; padding: 0 10px; font-size: 13px; }
.vf-btn--lg { height: 44px; padding: 0 18px; font-size: 15px; }
.vf-btn--primary { background: var(--primary); color: var(--on-primary); }
.vf-btn--primary:hover:not(:disabled) { background: var(--primary-hover); }
.vf-btn--secondary { background: var(--surface); border-color: var(--border-control); color: var(--ink); }
.vf-btn--secondary:hover:not(:disabled) { background: var(--surface-hover); }
.vf-btn--ghost { background: transparent; color: var(--ink); }
.vf-btn--ghost:hover:not(:disabled) { background: var(--surface-hover); }
.vf-btn--soft { background: var(--primary-soft); color: var(--primary-ink); }
.vf-btn--link { background: none; color: var(--primary); padding: 0 4px; height: auto; }
.vf-btn--link:hover { text-decoration: underline; }
.vf-btn--danger { background: var(--danger); color: var(--on-danger); }
.vf-btn--danger:hover:not(:disabled) { filter: brightness(.92); }
.vf-btn--danger-outline { background: var(--surface); color: var(--danger); border-color: var(--danger); }
.vf-btn--danger-outline:hover:not(:disabled) { background: var(--danger-soft); }
.vf-spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: vf-spin .8s linear infinite; }
@keyframes vf-spin { to { transform: rotate(360deg); } }
.vf-iconbtn { position: relative; display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: var(--radius-md); border: 1px solid transparent; background: none; color: var(--ink-muted); cursor: pointer; flex: none; }
.vf-iconbtn:hover:not(:disabled) { background: var(--surface-hover); color: var(--ink); }
.vf-iconbtn:disabled { opacity: .4; cursor: not-allowed; }
.vf-iconbtn--secondary { border-color: var(--border-control); background: var(--surface); }
.vf-iconbtn--primary { background: var(--primary); color: var(--on-primary); }
.vf-iconbtn__badge { position: absolute; top: 2px; inset-inline-end: 1px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: var(--radius-pill); background: var(--danger); color: var(--on-danger); font-size: 10px; line-height: 16px; font-weight: 600; text-align: center; }

/* ---------- Badges ---------- */
.vf-badge { display: inline-flex; align-items: center; gap: var(--space-1); height: 22px; padding: 0 8px; border-radius: var(--radius-sm); font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; margin-inline-end: 4px; }
.vf-badge:last-child { margin-inline-end: 0; }
.vf-badge--success { background: var(--success-soft); color: var(--success-ink); }
.vf-badge--warning { background: var(--warning-soft); color: var(--warning-ink); }
.vf-badge--danger { background: var(--danger-soft); color: var(--danger-ink); }
.vf-badge--neutral { background: var(--neutral-soft); color: var(--neutral-ink); }
.vf-badge--info { background: var(--primary-soft); color: var(--primary-ink); }
.vf-badge--accent { background: var(--accent-soft); color: var(--accent-ink); }
.vf-badge--company { background: var(--company-soft); color: var(--company-ink); }
.vf-typetag { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; line-height: 18px; white-space: nowrap; }
.vf-typetag__dot { width: 8px; height: 8px; border-radius: 2px; background: var(--cal-annual); }
.vf-typetag--unpaid .vf-typetag__dot { background: var(--cal-unpaid); }
.vf-typetag--sick .vf-typetag__dot, .vf-typetag--absent .vf-typetag__dot { background: var(--cal-absent); }
.vf-count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius-pill); background: var(--neutral-soft); color: var(--neutral-ink); font-size: 12px; font-weight: 600; margin-inline-start: 6px; }
.vf-count--strong { background: var(--primary); color: var(--on-primary); }

/* ---------- Avatar / person ---------- */
.vf-avatar { position: relative; display: inline-grid; place-items: center; border-radius: var(--radius-pill); color: #ffffff; font-weight: 600; flex: none; letter-spacing: .02em; }
.vf-avatar__status { position: absolute; inset-inline-end: -1px; bottom: -1px; width: 30%; height: 30%; border-radius: 50%; border: 2px solid var(--surface); }
.vf-avatar__status--away { background: var(--warning); } .vf-avatar__status--off { background: var(--cal-annual); } .vf-avatar__status--in { background: var(--success); }
.vf-person { display: inline-flex; align-items: center; gap: var(--space-2); min-width: 0; }
.vf-person__text { display: flex; flex-direction: column; min-width: 0; }
.vf-person__name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.vf-person__meta { font-size: 12px; line-height: 16px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- Balance & stats ---------- */
.vf-balance { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-3); }
.vf-balance__top { display: flex; justify-content: space-between; align-items: flex-start; gap: var(--space-3); }
.vf-balance__figure { margin: 4px 0 0; display: flex; align-items: baseline; gap: 6px; }
.vf-balance__figure .figure { font-size: 32px; line-height: 36px; }
.vf-balance__unit { color: var(--ink-muted); font-weight: 500; }
.vf-balance__after { margin: 4px 0 0; font-size: 13px; color: var(--ink-muted); }
.vf-meter { display: flex; height: 8px; border-radius: var(--radius-pill); background: var(--surface-sunken); overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
.vf-meter--lg { height: 12px; flex: 1; }
.vf-meter__seg { display: block; height: 100%; }
.vf-meter__seg--used { background: var(--primary); }
.vf-meter__seg--pending { background: repeating-linear-gradient(135deg, var(--warning) 0 4px, var(--warning-soft) 4px 7px); }
.vf-meter__legend { display: flex; flex-wrap: wrap; gap: var(--space-4); font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.vf-meter__legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.sw--used { background: var(--primary); } .sw--pending { background: repeating-linear-gradient(135deg, var(--warning) 0 3px, var(--warning-soft) 3px 5px); } .sw--free { background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--border-control); }
.vf-ledger { margin: var(--space-2) 0 0; border-top: 1px solid var(--border); padding-top: var(--space-2); display: flex; flex-direction: column; }
.vf-ledger div { display: flex; justify-content: space-between; padding: 5px 0; font-size: 13px; line-height: 18px; }
.vf-ledger dt { color: var(--ink-muted); } .vf-ledger dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 500; }
.vf-ledger .is-sub { padding-inline-start: var(--space-3); } .vf-ledger .is-sub dt, .vf-ledger .is-sub dd { color: var(--ink-muted); font-weight: 400; }
.vf-ledger .is-total { border-top: 1px solid var(--border); margin-top: 4px; padding-top: 8px; } .vf-ledger .is-total dt { color: var(--ink); font-weight: 600; } .vf-ledger .is-total dd { font-weight: 600; }
.vf-hint { color: var(--ink-muted); font-size: 12px; }
.vf-stat { padding: var(--space-4) var(--space-5); display: flex; flex-direction: column; gap: 4px; }

.vf-stat--danger .vf-stat__value { color: var(--danger); } .vf-stat--warning .vf-stat__value { color: var(--warning-ink); }

/* ---------- Lists ---------- */
.vf-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }

.vf-listrow { width: 100%; display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) 0; border: 0; background: none; text-align: start; cursor: pointer; border-radius: var(--radius-md); }

.vf-listrow__main { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.vf-listrow__side { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; text-align: end; }

.vf-datebadge { width: 44px; flex: none; border: 1px solid var(--border); border-radius: var(--radius-md); text-align: center; padding: 4px 0; display: flex; flex-direction: column; }

.vf-datebadge strong { font-size: 18px; line-height: 22px; }
.vf-conflict__icon { width: 32px; height: 32px; border-radius: var(--radius-md); background: var(--warning-soft); color: var(--warning-ink); display: grid; place-items: center; flex: none; }
.vf-list--cards { padding: var(--space-3); gap: var(--space-2); } .vf-list--cards > li + li { border: 0; }
.vf-mcard { width: 100%; display: flex; flex-direction: column; gap: 6px; padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); text-align: start; cursor: pointer; }
.vf-mcard__top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-2); }

/* ---------- Forms ---------- */
.vf-form { display: flex; flex-direction: column; gap: var(--space-4); }
.vf-form--2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
.vf-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.vf-field__label { font-size: 13px; line-height: 18px; font-weight: 600; }
.vf-req { color: var(--danger); } .vf-opt { color: var(--ink-muted); font-weight: 400; }
.vf-field__hint { margin: 0; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.vf-field__error { margin: 0; font-size: 12px; line-height: 16px; color: var(--danger); display: flex; gap: 4px; align-items: center; font-weight: 500; }
.vf-input { height: var(--control-height); width: 100%; padding: 0 10px; border: 1px solid var(--border-control); border-radius: var(--radius-md); background: var(--surface); color: var(--ink); font-size: 14px; }
.vf-input:hover { border-color: var(--ink-muted); }

.has-error .vf-input, .vf-input.is-invalid, .vf-input[aria-invalid="true"] { border-color: var(--danger); }
.vf-textarea { height: auto; min-height: 76px; padding: 8px 10px; resize: vertical; line-height: 20px; }
.vf-input::placeholder, .vf-placeholder { color: var(--ink-muted); }
.vf-select { position: relative; display: inline-flex; width: 100%; }
.vf-select select { appearance: none; height: var(--control-height); width: 100%; padding: 0 32px 0 10px; border: 1px solid var(--border-control); border-radius: var(--radius-md); background: var(--surface); cursor: pointer; font-size: 14px; }
.vf-select .vf-icon { position: absolute; inset-inline-end: 10px; top: 50%; transform: translateY(-50%); pointer-events: none; color: var(--ink-muted); }
.vf-inputgroup { display: flex; align-items: center; } .vf-inputgroup .vf-input { border-radius: var(--radius-md) 0 0 var(--radius-md); }
.vf-inputgroup span { height: var(--control-height); display: grid; place-items: center; padding: 0 10px; border: 1px solid var(--border-control); border-inline-start: 0; border-radius: 0 var(--radius-md) var(--radius-md) 0; background: var(--surface-sunken); color: var(--ink-muted); font-size: 13px; }
.vf-seg { display: inline-flex; padding: 3px; background: var(--surface-sunken); border-radius: var(--radius-md); gap: 2px; border: 1px solid var(--border); flex-wrap: wrap; }
.vf-seg button { height: 30px; padding: 0 12px; border: 0; background: none; border-radius: 4px; color: var(--ink-muted); cursor: pointer; font-weight: 500; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.vf-seg button:hover { color: var(--ink); }

.vf-seg--sm button { height: 26px; padding: 0 10px; font-size: 12px; }
.vf-toggle { display: inline-flex; align-items: center; gap: var(--space-2); cursor: pointer; font-size: 13px; }
.vf-toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }

.vf-toggle__thumb { position: absolute; top: 2px; inset-inline-start: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: var(--shadow-sm); }
.vf-toggle input:checked + .vf-toggle__track { background: var(--primary); }

.vf-toggle input:focus-visible + .vf-toggle__track { outline: 2px solid var(--primary); outline-offset: 2px; }
.vf-check { display: inline-flex; align-items: center; gap: var(--space-2); cursor: pointer; font-size: 13px; }

.vf-check input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.vf-check__box { width: 18px; height: 18px; border: 1px solid var(--border-control); border-radius: var(--radius-sm); display: grid; place-items: center; background: var(--surface); color: transparent; flex: none; }
.vf-check input:checked + .vf-check__box { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
.vf-check input:focus-visible + .vf-check__box { outline: 2px solid var(--primary); outline-offset: 2px; }
.vf-typehelp, .vf-note { margin: 0; display: flex; gap: 6px; align-items: flex-start; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.vf-tryhint { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; border: 1px dashed var(--primary); color: var(--primary-ink); background: var(--primary-soft); border-radius: var(--radius-pill); padding: 4px 10px; font-size: 12px; font-weight: 500; cursor: pointer; margin-top: -8px; }
.vf-file { display: inline-flex; align-items: center; gap: var(--space-2); padding: 4px 4px 4px 10px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--surface-sunken); font-size: 13px; }
.vf-formfoot { display: flex; flex-direction: column; gap: var(--space-3); padding: var(--space-4); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); }
.vf-formfoot__btns { display: flex; gap: var(--space-2); justify-content: flex-end; flex-wrap: wrap; }
.vf-errlist { margin: 4px 0 0; padding-inline-start: 18px; }

/* tabs */
.vf-tabs { display: flex; gap: var(--space-1); border-bottom: 1px solid var(--border); overflow-x: auto; }
.vf-tabs button { height: 40px; padding: 0 var(--space-3); border: 0; background: none; color: var(--ink-muted); font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; display: inline-flex; align-items: center; }

.vf-cardtabs { display: flex; justify-content: space-between; align-items: center; padding: 0 var(--space-4); border-bottom: 1px solid var(--border); gap: var(--space-3); }
.vf-cardtabs .vf-tabs { border-bottom: 0; }

/* search & filters */
.vf-filterbar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: flex-end; padding: var(--space-4); }
.vf-card > .vf-card__body + .vf-filterbar, .vf-card .vf-filterbar { border-bottom: 1px solid var(--border); }
.vf-page > .vf-filterbar { padding: 0; border: 0; }
.vf-search { position: relative; display: inline-flex; align-items: center; min-width: 260px; flex: 1; max-width: 360px; }
.vf-search > .vf-icon { position: absolute; inset-inline-start: 10px; color: var(--ink-muted); }
.vf-search input { width: 100%; height: var(--control-height); padding: 0 32px 0 34px; border: 1px solid var(--border-control); border-radius: var(--radius-md); background: var(--surface); }
.vf-search input:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
.vf-search button { position: absolute; inset-inline-end: 6px; border: 0; background: none; color: var(--ink-muted); cursor: pointer; display: grid; place-items: center; width: 24px; height: 24px; border-radius: 4px; }
.vf-filter { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
.vf-filter__label { font-size: 12px; line-height: 16px; color: var(--ink-muted); font-weight: 500; }
.vf-filter.is-active .vf-select select { border-color: var(--primary); }
.vf-filter .vf-input { width: 150px; }

/* date picker */
.vf-dp { position: relative; }
.vf-dp__trigger { display: flex; align-items: center; gap: var(--space-2); text-align: start; cursor: pointer; }
.vf-dp__trigger > span { flex: 1; }
.vf-dp__pop { position: absolute; z-index: 30; top: calc(100% + 6px); inset-inline-start: 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-md); padding: var(--space-3); width: max-content; }
.vf-dp__nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2); }
.vf-dp__hint { font-size: 12px; color: var(--ink-muted); }
.vf-dp__months { display: flex; gap: var(--space-5); }
.vf-dp__title { margin: 0 0 var(--space-2); text-align: center; font-weight: 600; font-size: 13px; }
.vf-dp__grid { display: grid; grid-template-columns: repeat(7, 34px); gap: 2px; }

.vf-dp__day:hover:not(:disabled) { background: var(--surface-hover); box-shadow: inset 0 0 0 1px var(--border-control); }
.vf-dp__day:disabled { color: var(--ink-disabled); cursor: not-allowed; }

.vf-dp__day.mk-public { background: var(--accent-soft); color: var(--accent-ink); }
.vf-dp__day.mk-company { background: var(--company-soft); color: var(--company-ink); }
.vf-dp__day.in-range { background: var(--primary-soft); color: var(--primary-ink); }
.vf-dp__day.in-range.mk-rest, .vf-dp__day.in-range.mk-public, .vf-dp__day.in-range.mk-company { text-decoration: line-through; }
.vf-dp__day.is-edge { background: var(--primary); color: var(--on-primary); font-weight: 600; text-decoration: none; }
.vf-dp__day.is-today::after { content: ''; position: absolute; bottom: 3px; inset-inline-start: 50%; width: 4px; height: 4px; margin-inline-start: -2px; border-radius: 50%; background: var(--accent); }
.vf-dp__legend { display: flex; gap: var(--space-4); margin-top: var(--space-3); font-size: 12px; color: var(--ink-muted); }
.vf-dp__legend span { display: inline-flex; align-items: center; gap: 6px; }
.mk { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.mk.mk-rest { background: var(--surface-sunken); box-shadow: inset 0 0 0 1px var(--border-control); } .mk.mk-public { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); } .mk.mk-company { background: var(--company-soft); box-shadow: inset 0 0 0 1px var(--company-ink); }

/* summary panel */
.vf-summary { display: flex; flex-direction: column; gap: var(--space-4); }
.vf-summary__big { display: flex; align-items: baseline; gap: var(--space-2); flex-wrap: wrap; }
.vf-summary__big .figure { font-size: 36px; line-height: 40px; color: var(--primary); }
.vf-summary__big span:last-child { color: var(--ink-muted); }
.vf-daylist { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; max-height: 260px; overflow-y: auto; }
.vf-daylist li { display: grid; grid-template-columns: 96px 1fr auto; gap: var(--space-2); padding: 6px 10px; font-size: 13px; line-height: 18px; border-top: 1px solid var(--border); }
.vf-daylist li:first-child { border-top: 0; }
.vf-daylist .is-rest { background: var(--surface-sunken); color: var(--ink-muted); }
.vf-daylist .is-public { background: var(--accent-soft); color: var(--accent-ink); }
.vf-daylist .is-company { background: var(--company-soft); color: var(--company-ink); }
.vf-daylist__date { font-weight: 500; } .vf-daylist__n { font-variant-numeric: tabular-nums; font-weight: 600; }
.vf-kv { margin: 0; display: flex; flex-direction: column; gap: 6px; }
.vf-kv > div { display: grid; grid-template-columns: 150px 1fr; gap: var(--space-3); font-size: 13px; line-height: 18px; }
.vf-kv dt { color: var(--ink-muted); } .vf-kv dd { margin: 0; }
.vf-kv--detail > div { padding: 8px 0; border-top: 1px solid var(--border); align-items: center; }
.vf-kv--detail > div:first-child { border-top: 0; }
.vf-beforeafter { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); padding: var(--space-3) var(--space-4); background: var(--surface-sunken); border-radius: var(--radius-md); }
.vf-beforeafter > div { display: flex; flex-direction: column; gap: 2px; }
.vf-beforeafter strong { font-size: 18px; line-height: 24px; font-variant-numeric: tabular-nums; }
.vf-route { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; }
.vf-route li { display: flex; gap: var(--space-3); position: relative; padding-bottom: var(--space-4); }
.vf-route li:last-child { padding-bottom: 0; }
.vf-route li:not(:last-child)::before { content: ''; position: absolute; inset-inline-start: 11px; top: 26px; bottom: 2px; width: 2px; background: var(--border); }
.vf-route li > span:last-child { display: flex; flex-direction: column; font-size: 13px; line-height: 18px; padding-top: 2px; }
.vf-route__dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--surface); border: 2px solid var(--primary); color: var(--primary-ink); font-size: 12px; font-weight: 600; }
.vf-route__dot.is-done { background: var(--primary); color: var(--on-primary); }
.vf-route__dot.is-final { border-color: var(--ink); color: var(--ink); background: var(--surface-sunken); }
.vf-route__dot.is-end { background: var(--success); border-color: var(--success); color: var(--surface); }

/* ---------- Tables ---------- */
.vf-table-wrap { width: 100%; overflow-x: auto; }
.vf-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.vf-table th { text-align: start; font-size: 12px; line-height: 16px; font-weight: 500; color: var(--ink-muted); background: var(--surface-sunken); padding: 10px var(--space-4); border-bottom: 1px solid var(--border); white-space: nowrap; }
.vf-table td { padding: 10px var(--space-4); border-bottom: 1px solid var(--border); vertical-align: middle; height: var(--row-height); }
.vf-table tbody tr:last-child td { border-bottom: 0; }
.vf-table--dense td { height: 44px; padding: 6px var(--space-4); font-size: 13px; }
.vf-table--dense th { padding: 8px var(--space-4); }
.vf-table tr.is-clickable { cursor: pointer; }
.vf-table tr.is-clickable:hover td { background: var(--surface-hover); }
.vf-table tr.is-selected td { background: var(--surface-selected); }
.vf-table tr.is-clickable:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.vf-th-sort { border: 0; background: none; padding: 0; color: inherit; font: inherit; display: inline-flex; gap: 4px; align-items: center; cursor: pointer; }
.vf-th-sort .is-idle { opacity: .35; } .vf-th-sort .is-asc { transform: rotate(180deg); }
.vf-mini-table { width: 100%; border-collapse: collapse; margin-top: var(--space-3); font-size: 13px; }
.vf-mini-table th, .vf-mini-table td { text-align: start; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.vf-mini-table th { color: var(--ink-muted); font-weight: 500; font-size: 12px; }
.vf-matrix td:not(:first-child), .vf-matrix th:not(:first-child) { text-align: center; }
.vf-ok { color: var(--success); }

/* ---------- Timeline ---------- */
.vf-timeline { list-style: none; margin: var(--space-3) 0 0; padding: 0; }
.vf-tl { display: flex; gap: var(--space-3); position: relative; padding-bottom: var(--space-5); }
.vf-tl:last-child { padding-bottom: 0; }
.vf-tl:not(:last-child)::before { content: ''; position: absolute; inset-inline-start: 10px; top: 24px; bottom: 0; width: 2px; background: var(--border); }
.vf-tl--done:not(:last-child)::before { background: var(--success); }
.vf-tl__dot { width: 22px; height: 22px; flex: none; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 2px solid var(--border-control); color: var(--surface); }
.vf-tl--done .vf-tl__dot { background: var(--success); border-color: var(--success); }
.vf-tl--active .vf-tl__dot { background: var(--warning-soft); border-color: var(--warning); color: var(--warning-ink); }
.vf-tl--rejected .vf-tl__dot, .vf-tl--cancelled .vf-tl__dot { background: var(--danger); border-color: var(--danger); }
.vf-tl--cancelled .vf-tl__dot { background: var(--neutral-ink); border-color: var(--neutral-ink); }
.vf-tl--skipped .vf-tl__dot, .vf-tl--waiting .vf-tl__dot { border-style: dashed; }
.vf-tl__body { flex: 1; min-width: 0; padding-top: 1px; }
.vf-tl__title { margin: 0; font-weight: 600; display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; }
.vf-tl--waiting .vf-tl__title, .vf-tl--skipped .vf-tl__title { color: var(--ink-muted); font-weight: 500; }
.vf-tl__tag { font-size: 11px; line-height: 16px; font-weight: 500; color: var(--ink-muted); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 0 6px; }
.vf-tl__tag--final { border-color: var(--ink-muted); color: var(--ink); }
.vf-tl__meta { margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.vf-tl__people { list-style: none; margin: var(--space-2) 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.vf-tl__people li { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; font-size: 13px; }
.vf-tl__pname { font-weight: 500; }
.vf-tl__dec { font-size: 12px; line-height: 16px; }
.vf-tl__dec--approved { color: var(--success-ink); } .vf-tl__dec--rejected { color: var(--danger-ink); font-weight: 600; } .vf-tl__dec--pending { color: var(--warning-ink); }
.vf-tl__comment { margin: 4px 0 0 28px; padding: 6px 10px; background: var(--surface-sunken); border-radius: var(--radius-md); font-size: 13px; line-height: 18px; color: var(--ink); width: 100%; }
.vf-tl > .vf-tl__body > .vf-tl__comment { margin-inline-start: 0; }

/* ---------- Overlays ---------- */
.vf-overlay { position: absolute; inset: 0; background: var(--overlay); z-index: 50; display: grid; place-items: center; padding: var(--space-6); }
.vf-preview .vf-overlay { position: relative; inset: auto; width: 100%; min-height: 340px; border-radius: var(--radius-lg); }
.vf-overlay--drawer { display: flex; justify-content: flex-end; align-items: stretch; padding: 0; }
.vf-dialog { width: 480px; max-width: 100%; max-height: calc(100vh - 48px); overflow: auto; background: var(--surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border); }
.vf-dialog--sm { width: 400px; }
.vf-dialog__head { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-4) var(--space-4) 0 var(--space-5); }
.vf-dialog__title { margin: 0; flex: 1; font-size: 16px; line-height: 24px; font-weight: 600; }
.vf-dialog__icon { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.vf-dialog__icon--danger { background: var(--danger-soft); color: var(--danger-ink); } .vf-dialog__icon--success { background: var(--success-soft); color: var(--success-ink); } .vf-dialog__icon--info { background: var(--primary-soft); color: var(--primary-ink); }
.vf-dialog__body { padding: var(--space-3) var(--space-5) var(--space-4); display: flex; flex-direction: column; gap: var(--space-3); }

.vf-app--mobile .vf-overlay { padding: var(--space-3); place-items: end stretch; }
.vf-app--mobile .vf-dialog { width: 100%; }
.vf-app--mobile .vf-toasts { inset-inline-start: var(--space-3); inset-inline-end: var(--space-3); bottom: 72px; }
.vf-app--mobile .vf-toast { width: 100%; }
.vf-app--mobile .vf-formfoot__btns .vf-btn { flex: 1; }
.vf-app--mobile .vf-cal__name { width: 120px; }
.vf-app--mobile .vf-legend { gap: var(--space-2) var(--space-3); }
.vf-app--mobile .vf-pop { position: fixed; inset-inline-start: 8px; inset-inline-end: 8px; width: auto; top: 56px; }
@media (max-width: 1180px) {
  .vf-grid--side { grid-template-columns: 220px minmax(0, 1fr); }
  .vf-grid--side > .vf-col--sticky { grid-column: 1 / -1; position: static; }
  .vf-grid--4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
.vf-field > .vf-seg { align-self: flex-start; }
.vf-table--dense td .body-strong, .vf-table td { white-space: nowrap; }
.vf-table td .small, .vf-table td .vf-stack-xs { white-space: normal; }
.vf-app--mobile .vf-dp__months > div:first-child { flex: 1; }
.vf-card__body:has(> .vf-cal) { overflow-x: auto; }

/* ---------- Persian / right-to-left ---------- */
.vf-app--fa { --font-sans: "Vazirmatn", "IBM Plex Sans", Tahoma, sans-serif; }
.vf-app--fa .figure, .vf-app--fa .page-title { letter-spacing: 0; }
.vf-app--fa .vf-nav__label, .vf-app--fa .vf-roleswitch__tag { letter-spacing: 0; text-transform: none; }
[dir="rtl"] .vf-icon--dir { transform: scaleX(-1); }
[dir="rtl"] .rot90 svg { transform: rotate(90deg); }
[dir="rtl"] .vf-nav__item.is-on::before { border-radius: 3px 0 0 3px; }
[dir="rtl"] .vf-inputgroup .vf-input { border-radius: 0 var(--radius-md) var(--radius-md) 0; }
[dir="rtl"] .vf-inputgroup span { border-radius: var(--radius-md) 0 0 var(--radius-md); }
[dir="rtl"] .vf-toggle input:checked + .vf-toggle__track .vf-toggle__thumb { transform: translateX(-16px); }
[dir="rtl"] .vf-cal__cell.is-today { box-shadow: inset -2px 0 0 var(--accent); }
[dir="rtl"] .vf-drawer__sub, [dir="rtl"] .code { direction: ltr; unicode-bidi: isolate; }
[dir="rtl"] input[type="date"], [dir="rtl"] input[type="time"], [dir="rtl"] input[type="number"] { direction: ltr; text-align: end; }
.vf-pop--locale { width: 300px; padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); }
.vf-pop--locale .vf-pop__title { margin: 0; font-size: 12px; color: var(--ink-muted); font-weight: 600; }
.vf-pop--locale .vf-seg { width: 100%; } .vf-pop--locale .vf-seg button { flex: 1; justify-content: center; }
.vf-pop__hint { margin: var(--space-1) 0 0; font-size: 12px; line-height: 16px; color: var(--ink-muted); }
.vf-brand__org, .vf-person__name, .vf-topbar__name, .vf-cal__pname { unicode-bidi: plaintext; }
.vf-legend__col { width: auto; min-width: 24px; padding: 0 4px; }
html, body { height: 100%; }
body { background: var(--canvas); color: var(--ink); }
#root { height: 100%; }
.vf-app { height: 100% !important; min-height: 0; }

    "e.g. Three of six team members are already off that week. Could you move it by a week?": "\u0645\u062B\u0644\u0627\u064B: \u0633\u0647 \u0646\u0641\u0631 \u0627\u0632 \u0634\u0634 \u0639\u0636\u0648 \u062A\u06CC\u0645 \u0622\u0646 \u0647\u0641\u062A\u0647 \u0645\u0631\u062E\u0635\u06CC\u200C\u0627\u0646\u062F. \u0645\u06CC\u200C\u0634\u0648\u062F \u06CC\u06A9 \u0647\u0641\u062A\u0647 \u062C\u0627\u0628\u0647\u200C\u062C\u0627 \u06A9\u0646\u06CC\u062F\u061F",
    "Three team members are already off 1\u20134 Dec during the Sinterklaas peak. Could you move this to the week of 7 Dec?": "\u0633\u0647 \u0646\u0641\u0631 \u0627\u0632 \u0627\u0639\u0636\u0627\u06CC \u062A\u06CC\u0645 \u062F\u0631 \u0627\u0648\u062C \u0634\u0644\u0648\u063A\u06CC \u06F1 \u062A\u0627 \u06F4 \u062F\u0633\u0627\u0645\u0628\u0631 \u0645\u0631\u062E\u0635\u06CC\u200C\u0627\u0646\u062F. \u0645\u0645\u06A9\u0646 \u0627\u0633\u062A \u0627\u06CC\u0646 \u0631\u0627 \u0628\u0647 \u0647\u0641\u062A\u0647\u0654 \u06F7 \u062F\u0633\u0627\u0645\u0628\u0631 \u0645\u0646\u062A\u0642\u0644 \u06A9\u0646\u06CC\u062F\u061F",
    "Use sample reason": "\u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0627\u0632 \u062F\u0644\u06CC\u0644 \u0646\u0645\u0648\u0646\u0647",
    "Remaining steps will be skipped.": "\u0645\u0631\u0627\u062D\u0644 \u0628\u0627\u0642\u06CC\u200C\u0645\u0627\u0646\u062F\u0647 \u0631\u062F \u0645\u06CC\u200C\u0634\u0648\u0646\u062F.",

    "This request needs {a} but only {b} are available.": "\u0627\u06CC\u0646 \u062F\u0631\u062E\u0648\u0627\u0633\u062A {a} \u0644\u0627\u0632\u0645 \u062F\u0627\u0631\u062F \u0627\u0645\u0627 \u0641\u0642\u0637 {b} \u0645\u0627\u0646\u062F\u0647 \u0627\u0633\u062A.",

    "Only if company policy asks for it. Stored with restricted HR access. PDF, JPG or PNG, max 10 MB.": "\u0641\u0642\u0637 \u062F\u0631 \u0635\u0648\u0631\u062A\u06CC \u06A9\u0647 \u0633\u06CC\u0627\u0633\u062A \u0634\u0631\u06A9\u062A \u0628\u062E\u0648\u0627\u0647\u062F. \u0628\u0627 \u062F\u0633\u062A\u0631\u0633\u06CC \u0645\u062D\u062F\u0648\u062F \u0645\u0646\u0627\u0628\u0639 \u0627\u0646\u0633\u0627\u0646\u06CC \u0630\u062E\u06CC\u0631\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F. PDF\u060C JPG \u06CC\u0627 PNG\u060C \u062D\u062F\u0627\u06A9\u062B\u0631 \u06F1\u06F0 \u0645\u06AF\u0627\u0628\u0627\u06CC\u062A.",

    "Unpaid leave doesn\u2019t use your annual leave balance. Payroll is informed after approval.": "\u0645\u0631\u062E\u0635\u06CC \u0628\u062F\u0648\u0646 \u062D\u0642\u0648\u0642 \u0627\u0632 \u0645\u0627\u0646\u062F\u0647\u0654 \u0627\u0633\u062A\u062D\u0642\u0627\u0642\u06CC \u0634\u0645\u0627 \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u0646\u0645\u06CC\u200C\u06A9\u0646\u062F. \u067E\u0633 \u0627\u0632 \u062A\u0623\u06CC\u06CC\u062F\u060C \u0648\u0627\u062D\u062F \u062D\u0642\u0648\u0642 \u0645\u0637\u0644\u0639 \u0645\u06CC\u200C\u0634\u0648\u062F.",

    "Bridge day": "\u0631\u0648\u0632 \u067E\u0644 (\u0628\u06CC\u0646 \u062F\u0648 \u062A\u0639\u0637\u06CC\u0644\u06CC)",
    "Office closed. Support desk staffed.": "\u062F\u0641\u062A\u0631 \u062A\u0639\u0637\u06CC\u0644 \u0627\u0633\u062A. \u0645\u06CC\u0632 \u067E\u0634\u062A\u06CC\u0628\u0627\u0646\u06CC \u062F\u0627\u06CC\u0631 \u0627\u0633\u062A.",
    "Whit Sunday": "\u06CC\u06A9\u0634\u0646\u0628\u0647\u0654 \u067E\u0646\u062A\u06CC\u06A9\u0627\u0633\u062A",
    "Whit Monday": "\u062F\u0648\u0634\u0646\u0628\u0647\u0654 \u067E\u0646\u062A\u06CC\u06A9\u0627\u0633\u062A",
    "Noordkade Day": "\u0631\u0648\u0632 Noordkade",
    "Annual company day. All staff off.": "\u0631\u0648\u0632 \u0633\u0627\u0644\u0627\u0646\u0647\u0654 \u0634\u0631\u06A9\u062A. \u0647\u0645\u0647\u0654 \u06A9\u0627\u0631\u06A9\u0646\u0627\u0646 \u062A\u0639\u0637\u06CC\u0644\u200C\u0627\u0646\u062F.",
    "Christmas Day": "\u0631\u0648\u0632 \u06A9\u0631\u06CC\u0633\u0645\u0633",
    "Boxing Day": "\u0631\u0648\u0632 \u062F\u0648\u0645 \u06A9\u0631\u06CC\u0633\u0645\u0633",
    "Paid vacation. Deducted from the annual leave balance.": "\u0645\u0631\u062E\u0635\u06CC \u0628\u0627 \u062D\u0642\u0648\u0642. \u0627\u0632 \u0645\u0627\u0646\u062F\u0647\u0654 \u0645\u0631\u062E\u0635\u06CC \u0627\u0633\u062A\u062D\u0642\u0627\u0642\u06CC \u06A9\u0633\u0631 \u0645\u06CC\u200C\u0634\u0648\u062F.",
    "Registered absence. Tracked separately; never deducted from annual leave. No medical details are stored.": "\u063A\u06CC\u0628\u062A \u062B\u0628\u062A\u200C\u0634\u062F\u0647. \u062C\u062F\u0627\u06AF\u0627\u0646\u0647 \u067E\u06CC\u06AF\u06CC\u0631\u06CC \u0645\u06CC\u200C\u0634\u0648\u062F \u0648 \u0647\u0631\u06AF\u0632 \u0627\u0632 \u0645\u0631\u062E\u0635\u06CC \u0627\u0633\u062A\u062D\u0642\u0627\u0642\u06CC \u06A9\u0633\u0631 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F. \u0647\u06CC\u0686 \u062C\u0632\u0626\u06CC\u0627\u062A \u067E\u0632\u0634\u06A9\u06CC \u0630\u062E\u06CC\u0631\u0647 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F.",
    "Unpaid absence. Requires approval; never deducted from annual leave.": "\u063A\u06CC\u0628\u062A \u0628\u062F\u0648\u0646 \u062D\u0642\u0648\u0642. \u0646\u06CC\u0627\u0632\u0645\u0646\u062F \u062A\u0623\u06CC\u06CC\u062F \u0627\u0633\u062A \u0648 \u0647\u0631\u06AF\u0632 \u0627\u0632 \u0645\u0631\u062E\u0635\u06CC \u0627\u0633\u062A\u062D\u0642\u0627\u0642\u06CC \u06A9\u0633\u0631 \u0646\u0645\u06CC\u200C\u0634\u0648\u062F.",
    "Standard \u2014 full-time": "\u0627\u0633\u062A\u0627\u0646\u062F\u0627\u0631\u062F \u2014 \u062A\u0645\u0627\u0645\u200C\u0648\u0642\u062A",
    "25 working days = 5 working weeks \xD7 5 days. Pro-rated by FTE.": "\u06F2\u06F5 \u0631\u0648\u0632 \u06A9\u0627\u0631\u06CC = \u06F5 \u0647\u0641\u062A\u0647\u0654 \u06A9\u0627\u0631\u06CC \xD7 \u06F5 \u0631\u0648\u0632. \u0645\u062A\u0646\u0627\u0633\u0628 \u0628\u0627 \u0636\u0631\u06CC\u0628 \u0627\u0634\u062A\u063A\u0627\u0644.",
    "\u201COne month per year\u201D (business wording)": "\xAB\u06CC\u06A9 \u0645\u0627\u0647 \u062F\u0631 \u0633\u0627\u0644\xBB (\u0639\u0628\u0627\u0631\u062A \u06A9\u0633\u0628\u200C\u0648\u06A9\u0627\u0631)",
    "Part-time \u2014 hours based": "\u067E\u0627\u0631\u0647\u200C\u0648\u0642\u062A \u2014 \u0628\u0631 \u0627\u0633\u0627\u0633 \u0633\u0627\u0639\u062A",
    "4 weeks \xD7 32 h + 1 week \xD7 32 h = 160 hours.": "\u06F4 \u0647\u0641\u062A\u0647 \xD7 \u06F3\u06F2 \u0633\u0627\u0639\u062A + \u06F1 \u0647\u0641\u062A\u0647 \xD7 \u06F3\u06F2 \u0633\u0627\u0639\u062A = \u06F1\u06F6\u06F0 \u0633\u0627\u0639\u062A.",
    "\u201COne month per year\u201D": "\xAB\u06CC\u06A9 \u0645\u0627\u0647 \u062F\u0631 \u0633\u0627\u0644\xBB",
    "Schedule A \u2014 Mon\u2013Fri": "\u0628\u0631\u0646\u0627\u0645\u0647\u0654 A \u2014 \u062F\u0648\u0634\u0646\u0628\u0647 \u062A\u0627 \u062C\u0645\u0639\u0647",
    "Standard office week. Saturday and Sunday are rest days.": "\u0647\u0641\u062A\u0647\u0654 \u0627\u062F\u0627\u0631\u06CC \u0627\u0633\u062A\u0627\u0646\u062F\u0627\u0631\u062F. \u0634\u0646\u0628\u0647 \u0648 \u06CC\u06A9\u0634\u0646\u0628\u0647 \u0631\u0648\u0632 \u0627\u0633\u062A\u0631\u0627\u062D\u062A \u0627\u0633\u062A.",
    "Mon\u2013Fri": "\u062F\u0648\u0634\u0646\u0628\u0647 \u062A\u0627 \u062C\u0645\u0639\u0647",
    "Schedule B \u2014 Sun\u2013Thu": "\u0628\u0631\u0646\u0627\u0645\u0647\u0654 B \u2014 \u06CC\u06A9\u0634\u0646\u0628\u0647 \u062A\u0627 \u067E\u0646\u062C\u0634\u0646\u0628\u0647",
    "International support desk. Friday and Saturday are rest days.": "\u0645\u06CC\u0632 \u067E\u0634\u062A\u06CC\u0628\u0627\u0646\u06CC \u0628\u06CC\u0646\u200C\u0627\u0644\u0645\u0644\u0644\u06CC. \u062C\u0645\u0639\u0647 \u0648 \u0634\u0646\u0628\u0647 \u0631\u0648\u0632 \u0627\u0633\u062A\u0631\u0627\u062D\u062A \u0627\u0633\u062A.",
    "Sun\u2013Thu": "\u06CC\u06A9\u0634\u0646\u0628\u0647 \u062A\u0627 \u067E\u0646\u062C\u0634\u0646\u0628\u0647",
    "Schedule P \u2014 Mon\u2013Thu (part-time)": "\u0628\u0631\u0646\u0627\u0645\u0647\u0654 P \u2014 \u062F\u0648\u0634\u0646\u0628\u0647 \u062A\u0627 \u067E\u0646\u062C\u0634\u0646\u0628\u0647 (\u067E\u0627\u0631\u0647\u200C\u0648\u0642\u062A)",
    "Four-day week, 32 hours. Friday, Saturday and Sunday are rest days.": "\u0647\u0641\u062A\u0647\u0654 \u0686\u0647\u0627\u0631\u0631\u0648\u0632\u0647\u060C \u06F3\u06F2 \u0633\u0627\u0639\u062A. \u062C\u0645\u0639\u0647\u060C \u0634\u0646\u0628\u0647 \u0648 \u06CC\u06A9\u0634\u0646\u0628\u0647 \u0631\u0648\u0632 \u0627\u0633\u062A\u0631\u0627\u062D\u062A \u0627\u0633\u062A.",
    "Mon\u2013Thu (part-time)": "\u062F\u0648\u0634\u0646\u0628\u0647 \u062A\u0627 \u067E\u0646\u062C\u0634\u0646\u0628\u0647 (\u067E\u0627\u0631\u0647\u200C\u0648\u0642\u062A)",
    "Employees on Schedule A or P at the Rotterdam office.": "\u06A9\u0627\u0631\u0645\u0646\u062F\u0627\u0646 \u0628\u0631\u0646\u0627\u0645\u0647\u0654 A \u06CC\u0627 P \u062F\u0631 \u062F\u0641\u062A\u0631 \u0631\u0648\u062A\u0631\u062F\u0627\u0645.",
    "Employees on Schedule B serving MENA customers.": "\u06A9\u0627\u0631\u0645\u0646\u062F\u0627\u0646 \u0628\u0631\u0646\u0627\u0645\u0647\u0654 B \u06A9\u0647 \u0628\u0647 \u0645\u0634\u062A\u0631\u06CC\u0627\u0646 \u062E\u0627\u0648\u0631\u0645\u06CC\u0627\u0646\u0647 \u0648 \u0634\u0645\u0627\u0644 \u0622\u0641\u0631\u06CC\u0642\u0627 \u062E\u062F\u0645\u062A \u0645\u06CC\u200C\u062F\u0647\u0646\u062F.",
    "Approved request": "\u062F\u0631\u062E\u0648\u0627\u0633\u062A \u062A\u0623\u06CC\u06CC\u062F \u0634\u062F",
    "Step 1 (all required): 1 of 2 approvals. Comment: \u201CFine for CS coverage.\u201D": "\u0645\u0631\u062D\u0644\u0647\u0654 \u06F1 (\u062A\u0623\u06CC\u06CC\u062F \u0647\u0645\u0647 \u0644\u0627\u0632\u0645): \u06F1 \u0627\u0632 \u06F2 \u062A\u0623\u06CC\u06CC\u062F. \u062A\u0648\u0636\u06CC\u062D: \xABFine for CS coverage.\xBB",
    "Step 1 complete \u2192 Final manager approval.": "\u0645\u0631\u062D\u0644\u0647\u0654 \u06F1 \u06A9\u0627\u0645\u0644 \u0634\u062F \u2190 \u062A\u0623\u06CC\u06CC\u062F \u0646\u0647\u0627\u06CC\u06CC \u0645\u062F\u06CC\u0631.",
    "Sequential step 2 of 2 complete \u2192 Final manager approval.": "\u0645\u0631\u062D\u0644\u0647\u0654 \u062A\u0631\u062A\u06CC\u0628\u06CC \u06F2 \u0627\u0632 \u06F2 \u06A9\u0627\u0645\u0644 \u0634\u062F \u2190 \u062A\u0623\u06CC\u06CC\u062F \u0646\u0647\u0627\u06CC\u06CC \u0645\u062F\u06CC\u0631.",
    "Final approval": "\u062A\u0623\u06CC\u06CC\u062F \u0646\u0647\u0627\u06CC\u06CC",
    "Request approved. 4 days consumed from 2026 balance.": "\u062F\u0631\u062E\u0648\u0627\u0633\u062A \u062A\u0623\u06CC\u06CC\u062F \u0634\u062F. \u06F4 \u0631\u0648\u0632 \u0627\u0632 \u0645\u0627\u0646\u062F\u0647\u0654 \u06F2\u06F0\u06F2\u06F6 \u06A9\u0633\u0631 \u0634\u062F.",
    "Changed holiday observance": "\u062A\u063A\u06CC\u06CC\u0631 \u0631\u0639\u0627\u06CC\u062A \u062A\u0639\u0637\u06CC\u0644\u06CC",
    "Noordkade Day \xB7 6 Nov 2026": "\u0631\u0648\u0632 Noordkade \xB7 \u06F6 \u0646\u0648\u0627\u0645\u0628\u0631 \u06F2\u06F0\u06F2\u06F6",
    "International support desk: not observed \u2192 observed.": "\u0645\u06CC\u0632 \u067E\u0634\u062A\u06CC\u0628\u0627\u0646\u06CC \u0628\u06CC\u0646\u200C\u0627\u0644\u0645\u0644\u0644\u06CC: \u0631\u0639\u0627\u06CC\u062A \u0646\u0645\u06CC\u200C\u0634\u062F \u2190 \u0631\u0639\u0627\u06CC\u062A \u0645\u06CC\u200C\u0634\u0648\u062F.",
    "Rejected request": "\u062F\u0631\u062E\u0648\u0627\u0633\u062A \u0631\u062F \u0634\u062F",
    "Reason: \u201CPeak season \u2014 two planners already off that week. Please pick September.\u201D": "\u062F\u0644\u06CC\u0644: \xABPeak season \u2014 two planners already off that week. Please pick September.\xBB",
    "Balance adjustment \u22121.0 day": "\u0627\u0635\u0644\u0627\u062D \u0645\u0627\u0646\u062F\u0647 \u2212\u06F1\u066B\u06F0 \u0631\u0648\u0632",
    "Ahmed El Amrani \xB7 2026": "Ahmed El Amrani \xB7 \u06F2\u06F0\u06F2\u06F6",

    "Changed approval rule": "\u062A\u063A\u06CC\u06CC\u0631 \u0642\u0627\u0639\u062F\u0647\u0654 \u062A\u0623\u06CC\u06CC\u062F",
    "Supervisors Daan Bakker, Priya Raman \xB7 rule: any one \u2192 all required. Effective 1 Apr 2026.": "\u0633\u0631\u067E\u0631\u0633\u062A\u0627\u0646 Daan Bakker \u0648 Priya Raman \xB7 \u0642\u0627\u0639\u062F\u0647: \u06CC\u06A9 \u0646\u0641\u0631 \u06A9\u0627\u0641\u06CC \u2190 \u0647\u0645\u0647 \u0644\u0627\u0632\u0645. \u0627\u0639\u0645\u0627\u0644 \u0627\u0632 \u06F1 \u0622\u0648\u0631\u06CC\u0644 \u06F2\u06F0\u06F2\u06F6.",
    "Balance adjustment +1.0 day": "\u0627\u0635\u0644\u0627\u062D \u0645\u0627\u0646\u062F\u0647 +\u06F1\u066B\u06F0 \u0631\u0648\u0632",
    "Long-service day (5+ years incl. traineeship) \u2014 policy LS-2.": "\u0631\u0648\u0632 \u0633\u0627\u0628\u0642\u0647\u0654 \u062E\u062F\u0645\u062A (\u06F5 \u0633\u0627\u0644 \u06CC\u0627 \u0628\u06CC\u0634\u062A\u0631\u060C \u0628\u0627 \u062F\u0648\u0631\u0647\u0654 \u06A9\u0627\u0631\u0622\u0645\u0648\u0632\u06CC) \u2014 \u0633\u06CC\u0627\u0633\u062A LS-2.",
    "Carry-over posted": "\u0627\u0646\u062A\u0642\u0627\u0644\u06CC \u062B\u0628\u062A \u0634\u062F",
    "14 employees \xB7 2025 \u2192 2026": "\u06F1\u06F4 \u06A9\u0627\u0631\u0645\u0646\u062F \xB7 \u06F2\u06F0\u06F2\u06F5 \u2190 \u06F2\u06F0\u06F2\u06F6",
    "Remaining 2025 balances carried over, capped at 5 days / 40 hours.": "\u0645\u0627\u0646\u062F\u0647\u200C\u0647\u0627\u06CC \u06F2\u06F0\u06F2\u06F5 \u0628\u0627 \u0633\u0642\u0641 \u06F5 \u0631\u0648\u0632 / \u06F4\u06F0 \u0633\u0627\u0639\u062A \u0645\u0646\u062A\u0642\u0644 \u0634\u062F.",

    "Your Christmas leave (28\u201331 Dec) was approved.": "\u0645\u0631\u062E\u0635\u06CC \u06A9\u0631\u06CC\u0633\u0645\u0633 \u0634\u0645\u0627 (\u06F2\u06F8 \u062A\u0627 \u06F3\u06F1 \u062F\u0633\u0627\u0645\u0628\u0631) \u062A\u0623\u06CC\u06CC\u062F \u0634\u062F.",
    "Lucas Peeters requested a half day on 20 Oct.": "Lucas Peeters \u0628\u0631\u0627\u06CC \u06F2\u06F0 \u0627\u06A9\u062A\u0628\u0631 \u0646\u06CC\u0645\u200C\u0631\u0648\u0632 \u0645\u0631\u062E\u0635\u06CC \u062E\u0648\u0627\u0633\u062A.",
    "Joris Meijer requested 2\u20136 Nov.": "Joris Meijer \u0628\u0631\u0627\u06CC \u06F2 \u062A\u0627 \u06F6 \u0646\u0648\u0627\u0645\u0628\u0631 \u0645\u0631\u062E\u0635\u06CC \u062E\u0648\u0627\u0633\u062A.",
    "Tim van Dijk\u2019s request is ready for final approval.": "\u062F\u0631\u062E\u0648\u0627\u0633\u062A Tim van Dijk \u0622\u0645\u0627\u062F\u0647\u0654 \u062A\u0623\u06CC\u06CC\u062F \u0646\u0647\u0627\u06CC\u06CC \u0627\u0633\u062A.",
    "Femke Smit reported sick (registered).": "Femke Smit \u0628\u06CC\u0645\u0627\u0631\u06CC \u062E\u0648\u062F \u0631\u0627 \u0627\u0639\u0644\u0627\u0645 \u06A9\u0631\u062F (\u062B\u0628\u062A \u0634\u062F).",
    "{name} requested {dates}.": "{name} \u0628\u0631\u0627\u06CC {dates} \u0645\u0631\u062E\u0635\u06CC \u062E\u0648\u0627\u0633\u062A.",

    "No comment.": "\u0628\u062F\u0648\u0646 \u062A\u0648\u0636\u06CC\u062D.",

    "Entitlement {a} \u2192 {b} {unit}; carry-over max {c}.": "\u0633\u0647\u0645\u06CC\u0647 {a} \u2190 {b} {unit}\u061B \u062D\u062F\u0627\u06A9\u062B\u0631 \u0627\u0646\u062A\u0642\u0627\u0644 {c}.",
    "{s} from {d} (previous schedule ends {e}).": "{s} \u0627\u0632 {d} (\u0628\u0631\u0646\u0627\u0645\u0647\u0654 \u0642\u0628\u0644\u06CC \u062F\u0631 {e} \u067E\u0627\u06CC\u0627\u0646 \u0645\u06CC\u200C\u06CC\u0627\u0628\u062F).",
    "{group}: not observed \u2192 company rest day.": "{group}: \u0631\u0639\u0627\u06CC\u062A \u0646\u0645\u06CC\u200C\u0634\u062F \u2190 \u0631\u0648\u0632 \u0627\u0633\u062A\u0631\u0627\u062D\u062A \u0634\u0631\u06A9\u062A.",
    "{group}: company rest day \u2192 normal working day.": "{group}: \u0631\u0648\u0632 \u0627\u0633\u062A\u0631\u0627\u062D\u062A \u0634\u0631\u06A9\u062A \u2190 \u0631\u0648\u0632 \u06A9\u0627\u0631\u06CC \u0639\u0627\u062F\u06CC.",
    "Observed by: {who}.": "\u0631\u0639\u0627\u06CC\u062A\u200C\u06A9\u0646\u0646\u062F\u06AF\u0627\u0646: {who}.",
    "Balance adjustment {n} {unit}": "\u0627\u0635\u0644\u0627\u062D \u0645\u0627\u0646\u062F\u0647 {n} {unit}",
    "Request annual leave": "\u062F\u0631\u062E\u0648\u0627\u0633\u062A \u0645\u0631\u062E\u0635\u06CC \u0627\u0633\u062A\u062D\u0642\u0627\u0642\u06CC",
    "Sanne de Vries (Employee)": "Sanne de Vries (\u06A9\u0627\u0631\u0645\u0646\u062F)",
    "Book Thu 12 \u2013 Mon 16 Nov and see it deduct 3 working days.": "\u0645\u0631\u062E\u0635\u06CC \u06F2\u06F1 \u062A\u0627 \u06F2\u06F5 \u0622\u0628\u0627\u0646 (\u06F1\u06F2 \u062A\u0627 \u06F1\u06F6 \u0646\u0648\u0627\u0645\u0628\u0631) \u0631\u0627 \u062B\u0628\u062A \u06A9\u0646\u06CC\u062F \u0648 \u0628\u0628\u06CC\u0646\u06CC\u062F \u0641\u0642\u0637 \u06F3 \u0631\u0648\u0632 \u06A9\u0627\u0631\u06CC \u06A9\u0633\u0631 \u0645\u06CC\u200C\u0634\u0648\u062F.",
    "Click \u201CRequest leave\u201D on the dashboard": "\u0631\u0648\u06CC \xAB\u062F\u0631\u062E\u0648\u0627\u0633\u062A \u0645\u0631\u062E\u0635\u06CC\xBB \u062F\u0631 \u062F\u0627\u0634\u0628\u0648\u0631\u062F \u06A9\u0644\u06CC\u06A9 \u06A9\u0646\u06CC\u062F",
    "Top-right of the greeting, or in the sidebar.": "\u06A9\u0646\u0627\u0631 \u067E\u06CC\u0627\u0645 \u062E\u0648\u0634\u200C\u0622\u0645\u062F \u06CC\u0627 \u062F\u0631 \u0646\u0648\u0627\u0631 \u06A9\u0646\u0627\u0631\u06CC.",
    "Select Thu 12 Nov \u2013 Mon 16 Nov 2026": "\u067E\u0646\u062C\u0634\u0646\u0628\u0647 \u06F2\u06F1 \u0622\u0628\u0627\u0646 \u062A\u0627 \u062F\u0648\u0634\u0646\u0628\u0647 \u06F2\u06F5 \u0622\u0628\u0627\u0646 \u06F1\u06F4\u06F0\u06F5 (\u06F1\u06F2 \u062A\u0627 \u06F1\u06F6 \u0646\u0648\u0627\u0645\u0628\u0631 \u06F2\u06F0\u06F2\u06F6) \u0631\u0627 \u0627\u0646\u062A\u062E\u0627\u0628 \u06A9\u0646\u06CC\u062F",
    "Open the date picker, click 12 Nov, then 16 Nov. Or use the \u201CTry\u201D shortcut.": "\u0627\u0646\u062A\u062E\u0627\u0628\u06AF\u0631 \u062A\u0627\u0631\u06CC\u062E \u0631\u0627 \u0628\u0627\u0632 \u06A9\u0646\u06CC\u062F\u060C \u0631\u0648\u06CC \u06F2\u06F1 \u0622\u0628\u0627\u0646 \u0648 \u0633\u067E\u0633 \u06F2\u06F5 \u0622\u0628\u0627\u0646 \u06A9\u0644\u06CC\u06A9 \u06A9\u0646\u06CC\u062F. \u06CC\u0627 \u0627\u0632 \u0645\u06CC\u0627\u0646\u200C\u0628\u0631 \xAB\u0627\u0645\u062A\u062D\u0627\u0646 \u06A9\u0646\u06CC\u062F\xBB \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u06A9\u0646\u06CC\u062F.",
    "Review the calculation: 3 working days, Sat + Sun excluded": "\u0645\u062D\u0627\u0633\u0628\u0647 \u0631\u0627 \u0628\u0631\u0631\u0633\u06CC \u06A9\u0646\u06CC\u062F: \u06F3 \u0631\u0648\u0632 \u06A9\u0627\u0631\u06CC\u060C \u0634\u0646\u0628\u0647 \u0648 \u06CC\u06A9\u0634\u0646\u0628\u0647 \u06A9\u0633\u0631 \u0646\u0645\u06CC\u200C\u0634\u0648\u0646\u062F",
    "Check the summary panel on the right, then tick \u201CI\u2019ve reviewed\u201D.": "\u067E\u0646\u0644 \u062E\u0644\u0627\u0635\u0647 \u0631\u0627 \u0628\u0628\u06CC\u0646\u06CC\u062F \u0648 \u0633\u067E\u0633 \xAB\u0645\u062D\u0627\u0633\u0628\u0647 \u0631\u0627 \u0628\u0631\u0631\u0633\u06CC \u06A9\u0631\u062F\u0645\xBB \u0631\u0627 \u062A\u06CC\u06A9 \u0628\u0632\u0646\u06CC\u062F.",
    "Submit the request": "\u062F\u0631\u062E\u0648\u0627\u0633\u062A \u0631\u0627 \u0627\u0631\u0633\u0627\u0644 \u06A9\u0646\u06CC\u062F",
    "Use the Submit request button.": "\u0627\u0632 \u062F\u06A9\u0645\u0647\u0654 \xAB\u0627\u0631\u0633\u0627\u0644 \u062F\u0631\u062E\u0648\u0627\u0633\u062A\xBB \u0627\u0633\u062A\u0641\u0627\u062F\u0647 \u06A9\u0646\u06CC\u062F.",
    "View the pending request and its approval route": "\u062F\u0631\u062E\u0648\u0627\u0633\u062A \u062F\u0631 \u0627\u0646\u062A\u0638\u0627\u0631 \u0648 \u0645\u0633\u06CC\u0631 \u062A\u0623\u06CC\u06CC\u062F \u0622\u0646 \u0631\u0627 \u0628\u0628\u06CC\u0646\u06CC\u062F",
    "Choose \u201CView request\u201D in the confirmation.": "\u062F\u0631 \u067E\u06CC\u0627\u0645 \u062A\u0623\u06CC\u06CC\u062F\u060C \xAB\u0645\u0634\u0627\u0647\u062F\u0647\u0654 \u062F\u0631\u062E\u0648\u0627\u0633\u062A\xBB \u0631\u0627 \u0627\u0646\u062A\u062E\u0627\u0628 \u06A9\u0646\u06CC\u062F.",
    "Supervisor approves": "\u062A\u0623\u06CC\u06CC\u062F \u0633\u0631\u067E\u0631\u0633\u062A",
    "Daan Bakker (Supervisor)": "Daan Bakker (\u0633\u0631\u067E\u0631\u0633\u062A)",
    "Approve Joris Meijer\u2019s request and watch it move to the manager.": "\u062F\u0631\u062E\u0648\u0627\u0633\u062A Joris Meijer \u0631\u0627 \u062A\u0623\u06CC\u06CC\u062F \u06A9\u0646\u06CC\u062F \u0648 \u0628\u0628\u06CC\u0646\u06CC\u062F \u0628\u0647 \u0645\u062F\u06CC\u0631 \u0645\u06CC\u200C\u0631\u0633\u062F.",
    "Open the Approval inbox": "\u0635\u0646\u062F\u0648\u0642 \u062A\u0623\u06CC\u06CC\u062F \u0631\u0627 \u0628\u0627\u0632 \u06A9\u0646\u06CC\u062F",
    "Open Joris Meijer\u2019s request (2\u20136 Nov)": "\u062F\u0631\u062E\u0648\u0627\u0633\u062A Joris Meijer (\u06F1\u06F1 \u062A\u0627 \u06F1\u06F5 \u0622\u0628\u0627\u0646 / \u06F2 \u062A\u0627 \u06F6 \u0646\u0648\u0627\u0645\u0628\u0631) \u0631\u0627 \u0628\u0627\u0632 \u06A9\u0646\u06CC\u062F",
    "Click the row.": "\u0631\u0648\u06CC \u0631\u062F\u06CC\u0641 \u06A9\u0644\u06CC\u06A9 \u06A9\u0646\u06CC\u062F.",
    "Review balance, availability and the timeline": "\u0645\u0627\u0646\u062F\u0647\u060C \u062D\u0636\u0648\u0631 \u062A\u06CC\u0645 \u0648 \u0631\u0648\u0646\u062F \u062A\u0623\u06CC\u06CC\u062F \u0631\u0627 \u0628\u0631\u0631\u0633\u06CC \u06A9\u0646\u06CC\u062F",
    "Scroll the details drawer.": "\u067E\u0646\u0644 \u062C\u0632\u0626\u06CC\u0627\u062A \u0631\u0627 \u067E\u06CC\u0645\u0627\u06CC\u0634 \u06A9\u0646\u06CC\u062F.",
    "Approve with an optional comment": "\u0628\u0627 \u062A\u0648\u0636\u06CC\u062D \u0627\u062E\u062A\u06CC\u0627\u0631\u06CC \u062A\u0623\u06CC\u06CC\u062F \u06A9\u0646\u06CC\u062F",
    "Approve \u2192 Confirm approval.": "\u062A\u0623\u06CC\u06CC\u062F \u2190 \u062B\u0628\u062A \u062A\u0623\u06CC\u06CC\u062F.",
    "See the status change to Pending Manager Approval": "\u062A\u063A\u06CC\u06CC\u0631 \u0648\u0636\u0639\u06CC\u062A \u0628\u0647 \xAB\u062F\u0631 \u0627\u0646\u062A\u0638\u0627\u0631 \u062A\u0623\u06CC\u06CC\u062F \u0645\u062F\u06CC\u0631\xBB \u0631\u0627 \u0628\u0628\u06CC\u0646\u06CC\u062F",
    "Manager gives final approval": "\u062A\u0623\u06CC\u06CC\u062F \u0646\u0647\u0627\u06CC\u06CC \u0645\u062F\u06CC\u0631",
    "Eva Jansen (Manager)": "Eva Jansen (\u0645\u062F\u06CC\u0631)",
    "Give final approval to Ahmed El Amrani\u2019s 14\u201318 Dec request.": "\u062F\u0631\u062E\u0648\u0627\u0633\u062A Ahmed El Amrani \u0628\u0631\u0627\u06CC \u06F2\u06F3 \u062A\u0627 \u06F2\u06F7 \u0622\u0630\u0631 (\u06F1\u06F4 \u062A\u0627 \u06F1\u06F8 \u062F\u0633\u0627\u0645\u0628\u0631) \u0631\u0627 \u0646\u0647\u0627\u06CC\u06CC \u062A\u0623\u06CC\u06CC\u062F \u06A9\u0646\u06CC\u062F.",
    "Open Final approvals": "\u062A\u0623\u06CC\u06CC\u062F\u0647\u0627\u06CC \u0646\u0647\u0627\u06CC\u06CC \u0631\u0627 \u0628\u0627\u0632 \u06A9\u0646\u06CC\u062F",
    "Open Ahmed El Amrani\u2019s request": "\u062F\u0631\u062E\u0648\u0627\u0633\u062A Ahmed El Amrani \u0631\u0627 \u0628\u0627\u0632 \u06A9\u0646\u06CC\u062F",
    "Note the staffing-conflict flag.": "\u0628\u0647 \u0646\u0634\u0627\u0646\u0647\u0654 \u062A\u062F\u0627\u062E\u0644 \u0646\u06CC\u0631\u0648 \u062A\u0648\u062C\u0647 \u06A9\u0646\u06CC\u062F.",
    "Approve as the final step": "\u0628\u0647\u200C\u0639\u0646\u0648\u0627\u0646 \u0645\u0631\u062D\u0644\u0647\u0654 \u0646\u0647\u0627\u06CC\u06CC \u062A\u0623\u06CC\u06CC\u062F \u06A9\u0646\u06CC\u062F",
    "See the request become Approved and recorded": "\u0628\u0628\u06CC\u0646\u06CC\u062F \u062F\u0631\u062E\u0648\u0627\u0633\u062A \xAB\u062A\u0623\u06CC\u06CC\u062F \u0648 \u062B\u0628\u062A\xBB \u0645\u06CC\u200C\u0634\u0648\u062F",
    "Reject with a reason": "\u0631\u062F \u0628\u0627 \u0630\u06A9\u0631 \u062F\u0644\u06CC\u0644",
    "Reject Mila Bos\u2019s 30 Nov \u2013 4 Dec request; a reason is mandatory.": "\u062F\u0631\u062E\u0648\u0627\u0633\u062A Mila Bos \u0628\u0631\u0627\u06CC \u06F9 \u062A\u0627 \u06F1\u06F3 \u0622\u0630\u0631 (\u06F3\u06F0 \u0646\u0648\u0627\u0645\u0628\u0631 \u062A\u0627 \u06F4 \u062F\u0633\u0627\u0645\u0628\u0631) \u0631\u0627 \u0631\u062F \u06A9\u0646\u06CC\u062F\u061B \u0630\u06A9\u0631 \u062F\u0644\u06CC\u0644 \u0627\u0644\u0632\u0627\u0645\u06CC \u0627\u0633\u062A.",
    "Open Mila Bos\u2019s request": "\u062F\u0631\u062E\u0648\u0627\u0633\u062A Mila Bos \u0631\u0627 \u0628\u0627\u0632 \u06A9\u0646\u06CC\u062F",
    "It carries a team-availability warning.": "\u0627\u06CC\u0646 \u062F\u0631\u062E\u0648\u0627\u0633\u062A \u0647\u0634\u062F\u0627\u0631 \u062D\u0636\u0648\u0631 \u062A\u06CC\u0645 \u062F\u0627\u0631\u062F.",
    "Click Reject": "\u0631\u0648\u06CC \xAB\u0631\u062F \u06A9\u0631\u062F\u0646\xBB \u06A9\u0644\u06CC\u06A9 \u06A9\u0646\u06CC\u062F",
    "Try to confirm without a reason \u2014 it\u2019s blocked": "\u0628\u062F\u0648\u0646 \u062F\u0644\u06CC\u0644 \u062B\u0628\u062A \u06A9\u0646\u06CC\u062F \u2014 \u062C\u0644\u0648\u06CC \u0622\u0646 \u06AF\u0631\u0641\u062A\u0647 \u0645\u06CC\u200C\u0634\u0648\u062F",
    "Click \u201CReject request\u201D with the reason empty.": "\u0628\u0627 \u062F\u0644\u06CC\u0644 \u062E\u0627\u0644\u06CC \u0631\u0648\u06CC \xAB\u0631\u062F \u062F\u0631\u062E\u0648\u0627\u0633\u062A\xBB \u06A9\u0644\u06CC\u06A9 \u06A9\u0646\u06CC\u062F.",
    "Enter a reason and confirm": "\u062F\u0644\u06CC\u0644 \u0631\u0627 \u0628\u0646\u0648\u06CC\u0633\u06CC\u062F \u0648 \u062B\u0628\u062A \u06A9\u0646\u06CC\u062F",
    "See the Rejected status and the comment in the timeline": "\u0648\u0636\u0639\u06CC\u062A \xAB\u0631\u062F\u0634\u062F\u0647\xBB \u0648 \u062A\u0648\u0636\u06CC\u062D \u0631\u0627 \u062F\u0631 \u0631\u0648\u0646\u062F \u062A\u0623\u06CC\u06CC\u062F \u0628\u0628\u06CC\u0646\u06CC\u062F",
    "HR assigns supervisors": "\u062A\u0639\u06CC\u06CC\u0646 \u0633\u0631\u067E\u0631\u0633\u062A\u0627\u0646 \u062A\u0648\u0633\u0637 \u0645\u0646\u0627\u0628\u0639 \u0627\u0646\u0633\u0627\u0646\u06CC",
    "Lotte Visser (HR admin)": "Lotte Visser (\u0645\u062F\u06CC\u0631 \u0645\u0646\u0627\u0628\u0639 \u0627\u0646\u0633\u0627\u0646\u06CC)",
    "Give Lucas Peeters two supervisors, an approval rule and a final manager.": "\u0628\u0631\u0627\u06CC Lucas Peeters \u062F\u0648 \u0633\u0631\u067E\u0631\u0633\u062A\u060C \u06CC\u06A9 \u0642\u0627\u0639\u062F\u0647\u0654 \u062A\u0623\u06CC\u06CC\u062F \u0648 \u06CC\u06A9 \u0645\u062F\u06CC\u0631 \u0646\u0647\u0627\u06CC\u06CC \u062A\u0639\u06CC\u06CC\u0646 \u06A9\u0646\u06CC\u062F.",
    "Open Employees": "\u06A9\u0627\u0631\u0645\u0646\u062F\u0627\u0646 \u0631\u0627 \u0628\u0627\u0632 \u06A9\u0646\u06CC\u062F",
    "Edit Lucas Peeters": "Lucas Peeters \u0631\u0627 \u0648\u06CC\u0631\u0627\u06CC\u0634 \u06A9\u0646\u06CC\u062F",
    "Find him in the list, then choose Edit.": "\u0627\u0648 \u0631\u0627 \u062F\u0631 \u0641\u0647\u0631\u0633\u062A \u067E\u06CC\u062F\u0627 \u06A9\u0646\u06CC\u062F \u0648 \xAB\u0648\u06CC\u0631\u0627\u06CC\u0634\xBB \u0631\u0627 \u0628\u0632\u0646\u06CC\u062F.",
    "Add Priya Raman as a second supervisor": "Priya Raman \u0631\u0627 \u0628\u0647\u200C\u0639\u0646\u0648\u0627\u0646 \u0633\u0631\u067E\u0631\u0633\u062A \u062F\u0648\u0645 \u0627\u0636\u0627\u0641\u0647 \u06A9\u0646\u06CC\u062F",
    "Choose the approval rule (e.g. All supervisors)": "\u0642\u0627\u0639\u062F\u0647\u0654 \u062A\u0623\u06CC\u06CC\u062F \u0631\u0627 \u0627\u0646\u062A\u062E\u0627\u0628 \u06A9\u0646\u06CC\u062F (\u0645\u062B\u0644\u0627\u064B \u0647\u0645\u0647\u0654 \u0633\u0631\u067E\u0631\u0633\u062A\u0627\u0646)",
    "Confirm the final manager and effective date": "\u0645\u062F\u06CC\u0631 \u0646\u0647\u0627\u06CC\u06CC \u0648 \u062A\u0627\u0631\u06CC\u062E \u0627\u0639\u0645\u0627\u0644 \u0631\u0627 \u062A\u0623\u06CC\u06CC\u062F \u06A9\u0646\u06CC\u062F",
    "Save \u2014 the change is written to the audit log": "\u0630\u062E\u06CC\u0631\u0647 \u06A9\u0646\u06CC\u062F \u2014 \u062A\u063A\u06CC\u06CC\u0631 \u062F\u0631 \u06AF\u0632\u0627\u0631\u0634 \u0645\u0645\u06CC\u0632\u06CC \u062B\u0628\u062A \u0645\u06CC\u200C\u0634\u0648\u062F",
    "Create a working schedule": "\u0627\u06CC\u062C\u0627\u062F \u0628\u0631\u0646\u0627\u0645\u0647\u0654 \u06A9\u0627\u0631\u06CC",
    "Create a 4\xD79 schedule, assign it to Femke Smit from 1 Dec and preview the impact.": "\u06CC\u06A9 \u0628\u0631\u0646\u0627\u0645\u0647\u0654 \u06F4\xD7\u06F9 \u0628\u0633\u0627\u0632\u06CC\u062F\u060C \u0622\u0646 \u0631\u0627 \u0627\u0632 \u06F1\u06F0 \u0622\u0630\u0631 (\u06F1 \u062F\u0633\u0627\u0645\u0628\u0631) \u0628\u0647 Femke Smit \u0627\u062E\u062A\u0635\u0627\u0635 \u062F\u0647\u06CC\u062F \u0648 \u0627\u062B\u0631\u0634 \u0631\u0627 \u0628\u0628\u06CC\u0646\u06CC\u062F.",
